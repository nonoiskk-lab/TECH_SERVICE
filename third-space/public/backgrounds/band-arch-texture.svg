<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" preserveAspectRatio="xMaxYMid slice" role="presentation" aria-hidden="true">
  <title>Band arch texture</title>
  <defs>
    <!-- Transparent base: the band's own orange shows through, so one file works on both
         the deep orange (#A63500) and the bright orange (#FF7A1A) bands. -->
    <linearGradient id="bandFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="78%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <mask id="bandMask">
      <rect width="1600" height="600" fill="url(#bandFade)" />
    </mask>
  </defs>

  <g mask="url(#bandMask)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M1120 600 V320 a200 200 0 0 1 400 0 V600" stroke-width="3" opacity="0.14" />
    <path d="M1010 600 V256 a310 310 0 0 1 620 0 V600" stroke-width="3" opacity="0.10" />
    <path d="M 890 600 V190 a430 430 0 0 1 860 0 V600" stroke-width="2.5" opacity="0.07" />
  </g>
  <circle cx="1252" cy="128" r="8" fill="#FFFFFF" opacity="0.2" />
</svg>
