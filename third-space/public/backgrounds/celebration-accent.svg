<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" preserveAspectRatio="xMaxYMid slice" role="presentation" aria-hidden="true">
  <title>Celebration accent</title>
  <defs>
    <linearGradient id="celebFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <mask id="celebMask">
      <rect width="520" height="160" fill="url(#celebFade)" />
    </mask>
  </defs>

  <!-- Geometric confetti and thin arcs, generous spacing. No balloons, no streamers. -->
  <g mask="url(#celebMask)">
    <g fill="none" stroke="#F1D9C6" stroke-width="2" stroke-linecap="round">
      <path d="M232 150 a58 58 0 0 1 116 0" opacity="0.85" />
      <path d="M300 150 a92 92 0 0 1 184 0" opacity="0.6" />
      <path d="M396 150 a44 44 0 0 1 88 0" opacity="0.9" />
    </g>
    <g fill="#F1D9C6">
      <rect x="262" y="44" width="9" height="9" rx="2" transform="rotate(22 266 48)" opacity="0.9" />
      <rect x="440" y="36" width="8" height="8" rx="2" transform="rotate(-18 444 40)" opacity="0.75" />
      <rect x="352" y="92" width="7" height="7" rx="2" transform="rotate(35 355 95)" opacity="0.7" />
      <circle cx="312" cy="72" r="4" opacity="0.8" />
      <circle cx="486" cy="86" r="5" opacity="0.6" />
    </g>
    <g fill="#FF7A1A">
      <circle cx="396" cy="52" r="5.5" opacity="0.55" />
      <rect x="286" y="110" width="8" height="8" rx="2" transform="rotate(16 290 114)" opacity="0.4" />
      <circle cx="458" cy="118" r="4" opacity="0.45" />
    </g>
  </g>
</svg>
